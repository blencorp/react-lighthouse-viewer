name: Pages

on:
  push:
    branches: [main]
  # Refresh the sample reports every week.
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Let a started deploy finish; the next run deploys right after it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm reports
        env:
          # A key restricted to the PageSpeed Insights API, without a website restriction, because
          # the requests come from this runner.
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_SERVER_API_KEY }}
      - run: pnpm --filter example build
        env:
          # A browser key restricted to blencorp.github.io (see docs/pagespeed-api-key.md).
          VITE_PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
